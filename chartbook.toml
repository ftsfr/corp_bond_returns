[project]
name = "Corporate Bond Returns"
description = "Corporate bond returns from OpenBondAssetPricing.com (TRACE data), including individual bond returns and credit spread-sorted portfolios"
contributors = [
    "Jeremy Bejarano",
]
repo_url = "https://github.com/ftsfr/corp_bond_returns"
copyright = "2025"
os_compatibility = [
    "Windows",
    "Linux",
    "MacOS",
]
requires_chartbook = ">=0.4.0"

[scripts]
build = "doit"

[notebooks.summary_corp_bond_returns]
name = "summary_corp_bond_returns"
description = "Summary statistics and visualization of corporate bond returns"
path = "_output/summary_corp_bond_returns.ipynb"
publishable = true

[dataframes.ftsfr_corp_bond_returns]
name = "ftsfr_corp_bond_returns"
description = "Individual corporate bond monthly returns in long format"
sources = [
    "OpenBondAssetPricing.com",
]
providers = [
    "OpenBondAssetPricing",
]
contact_required = [
    "no",
]
pre_approved = [
    "No",
]
provider_links = [
    "https://openbondassetpricing.com/",
]
tags = [
    "corporate",
    "bonds",
    "returns",
    "credit",
]
access_types = [
    "Public",
]
license = "Public"
restrictions = "No"
pull_method = "Downloaded from OpenBondAssetPricing.com"
path = "./_data/ftsfr_corp_bond_returns.parquet"
date_col = "ds"
docs = """
## Individual Corporate Bond Monthly Returns

This dataset contains monthly returns for individual corporate bonds from TRACE data.

### Columns

| Column | Description |
|--------|-------------|
| unique_id | Bond CUSIP identifier |
| ds | Month-end date |
| y | Monthly return (value-weighted) |

### Data Source

OpenBondAssetPricing.com (TRACE data with MMN adjustments)

### Time Period

2002 - present
"""

[dataframes.ftsfr_corp_bond_portfolio_returns]
name = "ftsfr_corp_bond_portfolio_returns"
description = "Corporate bond portfolio returns grouped by credit spread deciles"
sources = [
    "OpenBondAssetPricing.com",
]
providers = [
    "OpenBondAssetPricing",
]
contact_required = [
    "no",
]
pre_approved = [
    "No",
]
provider_links = [
    "https://openbondassetpricing.com/",
]
tags = [
    "corporate",
    "bonds",
    "portfolios",
    "returns",
    "credit",
]
access_types = [
    "Public",
]
license = "Public"
restrictions = "No"
pull_method = "Downloaded from OpenBondAssetPricing.com"
path = "./_data/ftsfr_corp_bond_portfolio_returns.parquet"
date_col = "ds"
docs = """
## Corporate Bond Portfolio Returns

This dataset contains portfolio returns grouped by credit spread deciles.

### Columns

| Column | Description |
|--------|-------------|
| unique_id | Credit spread decile (1-10) |
| ds | Month-end date |
| y | Value-weighted monthly return for the decile |

### Credit Spread Deciles

| Decile | Description |
|--------|-------------|
| 1 | Lowest credit spread (safest bonds) |
| 2-9 | Intermediate credit spreads |
| 10 | Highest credit spread (riskiest bonds) |

### Data Source

OpenBondAssetPricing.com (TRACE data with MMN adjustments)
"""

[charts.corp_bond_returns_replication]
name = "Corporate Bond Portfolio Returns"
description = "Corporate bond portfolio returns by credit spread decile from TRACE data"
dataframe = "ftsfr_corp_bond_portfolio_returns"
path = "./_output/corp_bond_returns_replication.html"
tags = [
    "corporate",
    "bonds",
    "returns",
    "credit",
    "replication",
]
publications = [
    "He, Kelly, and Manela (2017) - Intermediary Asset Pricing",
    "Dickerson, Mueller, and Robotti (2023) - Priced Risk in Corporate Bonds",
]
docs = """
## Corporate Bond Portfolio Returns

Monthly returns for portfolios sorted by credit spread decile.

### Data Source

OpenBondAssetPricing.com (TRACE data with MMN adjustments)

### Portfolio Construction

Decile 1 = lowest spread (safest), Decile 10 = highest spread (riskiest)
"""

[charts.corp_bond_cumulative_returns]
name = "Corporate Bond Portfolio Cumulative Returns"
description = "Cumulative returns showing growth of $1 invested in corporate bond portfolios"
dataframe = "ftsfr_corp_bond_portfolio_returns"
path = "./_output/corp_bond_cumulative_returns.html"
tags = [
    "corporate",
    "bonds",
    "cumulative returns",
    "credit",
    "replication",
]
publications = [
    "He, Kelly, and Manela (2017) - Intermediary Asset Pricing",
    "Dickerson, Mueller, and Robotti (2023) - Priced Risk in Corporate Bonds",
]
docs = """
## Corporate Bond Portfolio Cumulative Returns

Cumulative returns showing growth of $1 invested in corporate bond portfolios sorted by credit spread decile.

### Portfolio Construction

Decile 1 = lowest spread (safest), Decile 10 = highest spread (riskiest)

### Calculation

Cumulative return = Product of (1 + monthly return) over time
"""
